name: M6405 & M6450 Bus Commute Tracker

on:
  schedule:
    # 1. 아침 출근 세션: 한국 시각 05:00 (UTC 전날 20:00) 매주 월~금
    - cron: '0 20 * * 0-4'
    # 2. 저녁 퇴근 세션: 한국 시각 17:00 (UTC 당일 08:00) 매주 월~금
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: '수집 세션 선택 (morning: 아침 출근 05~10시 / evening: 저녁 퇴근 17~22시 / manual: 테스트)'
        required: true
        default: 'manual'
        type: choice
        options:
          - morning
          - evening
          - manual
      duration:
        description: '실행 시간 (초 단위, manual 테스트용 예: 60)'
        required: false
        default: '60'

jobs:
  track-bus:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 최대 6시간 안전 제한

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 세션 자동 판별 및 버스 데이터 수집 실행
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COLLECT_INTERVAL_SEC: 40
        run: |
          # 수동 실행인 경우
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.session }}" = "manual" ]; then
              python run_session.py --session manual --duration ${{ github.event.inputs.duration }}
            else
              python run_session.py --session ${{ github.event.inputs.session }}
            fi
          else
            # 스케줄 자동 실행인 경우 (현재 UTC 시각으로 출근/퇴근 자동 판별)
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 18 ] || [ "$HOUR" -le 2 ]; then
              echo "🌅 아침 출근 세션 (05:00 ~ 10:00) 시작"
              python run_session.py --session morning
            else
              echo "🌆 저녁 퇴근 세션 (17:00 ~ 22:00) 시작"
              python run_session.py --session evening
            fi
          fi
